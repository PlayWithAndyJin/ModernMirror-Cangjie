[package]
  cjc-version = "1.0.5"
  name = "modernmirror"
  description = "ModernMirror 仓颉后端"
  version = "1.1.25"
  target-dir = ""
  output-type = "executable"
  compile-option = ""
  override-compile-option = ""
  link-option = "-L.deps/hitls/lib -lhitls -lz -L.deps/stdx/stdx -lstdx.crypto.digest -lstdx.crypto.crypto -lstdx.crypto -lstdx.encoding.hex -lstdx.encoding.base64 -lstdx.encoding.json -lstdx.encoding.url -lstdx.encoding -lstdx.net.http -lstdx.net -lstdx.log -lstdx.logger -lstdx -lcangjie-dynamicLoader-opensslFFI -lsqlite3"
  package-configuration = {}

[dependencies]

[target.aarch64-apple-darwin]
  [target.aarch64-apple-darwin.bin-dependencies]
    path-option = [".deps/stdx/stdx"]

[target.x86_64-apple-darwin]
  [target.x86_64-apple-darwin.bin-dependencies]
    path-option = [".deps/stdx/stdx"]

[target.x86_64-unknown-linux-gnu]
  [target.x86_64-unknown-linux-gnu.bin-dependencies]
    path-option = [".deps/stdx/stdx"]

[target.aarch64-unknown-linux-gnu]
  [target.aarch64-unknown-linux-gnu.bin-dependencies]
    path-option = [".deps/stdx/stdx"]
